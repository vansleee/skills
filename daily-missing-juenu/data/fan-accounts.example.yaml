# fan-accounts.example.yaml
#
# Seed watchlist of public fan accounts. The real fan-accounts.yaml is
# gitignored — it evolves locally over time as hit_count and last_seen
# change. This example lists only the handles; rename to fan-accounts.yaml
# on first install and customize freely.
#
# Schema:
#   handle:     account handle, no leading @ (required, dedupe key)
#   platform:   tiktok | youtube | instagram | threads (required)
#   country:    ISO-like two-letter code (optional)
#   hit_count:  how many times a post from this account was included (int)
#   last_seen:  most recent hit date, YYYY-MM-DD (null if never)
#   active:     include in list-accounts results when --active is set
#   notes:      free-form (optional)

